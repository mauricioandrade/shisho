name: Release

# A tag v0.1.0 publishes the Shishō 0.1.0: shisho.jar and its checksum in a GitHub Release.
# See docs/adr/0010-release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test the tagged version
        run: mvn -B -Drevision="${GITHUB_REF_NAME#v}" verify
      - name: Check that the jar says its version
        run: java -jar target/shisho.jar --version | grep -Fx "Shishō ${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target
          sha256sum shisho.jar > shisho.jar.sha256
          gh release create "$GITHUB_REF_NAME" shisho.jar shisho.jar.sha256 \
            --title "Shishō ${GITHUB_REF_NAME#v}" --generate-notes
