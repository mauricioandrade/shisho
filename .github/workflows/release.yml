name: Release

# A tag v0.2.0 publishes the Shishō 0.2.0: shisho.jar and its checksum in a GitHub Release, with
# the 0.2.0 section of CHANGELOG.md and CHANGELOG.en.md as its notes. See docs/adr/0010-release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the release notes from the changelogs
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() { awk -v heading="## [$version]" 'index($0, heading) == 1 { on = 1; next } on && /^## \[/ { exit } on' "$1"; }
          pt="$(section CHANGELOG.md)"
          en="$(section CHANGELOG.en.md)"
          if [ -z "$pt" ] || [ -z "$en" ]; then
            echo "CHANGELOG.md and CHANGELOG.en.md need a section for $version" >&2
            exit 1
          fi
          printf '%s\n\n---\n\n%s\n' "$pt" "$en" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test the tagged version
        run: mvn -B -Drevision="${GITHUB_REF_NAME#v}" verify
      - name: Check that the jar says its version
        run: java -jar target/shisho.jar --version | grep -Fx "Shishō ${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target
          sha256sum shisho.jar > shisho.jar.sha256
          gh release create "$GITHUB_REF_NAME" shisho.jar shisho.jar.sha256 \
            --title "Shishō ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
