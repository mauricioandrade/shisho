shisho.analyze.usage.description=Applies the katas to a project and gives it a rank. Exit code: 0 no severe lessons, 1 severe lessons, 2 invalid input, 3 project could not be analyzed.
analyze.project=Root directory of the project (where pom.xml or build.gradle is).
analyze.format=Report format: terminal, sarif (for GitHub code scanning) or html (a page for the browser). Default: terminal.
analyze.output=Writes the report to this file instead of the screen.
analyze.sensei=Sensei mode: shows, for each kata found, why it exists, when the flagged code is fine, the code before and after the fix, and the sources.
analyze.shoshin=Shoshin mode (初心, beginner's mind): explains the concepts that appear in the code, such as records, dependency injection and the Strategy pattern, and where each one is. Terminal report only.
shisho.fix.usage.description=Fixes in the code the lessons that have a safe mechanical correction. Shows the diff; with --apply, writes the files. Exit code: 0 ok, 2 invalid input, 3 project not analyzed or file not written.
