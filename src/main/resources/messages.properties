shisho.crud.usage.description=Creates a REST CRUD in the project's architecture (or the one in --arquitetura) and explains every file: entity, repository, DTOs, service, controller and error handling. Never overwrites a file, and only generates an architecture of medium or high cost if the shisho.yaml context justifies it (or with --mesmo-assim). Exit code: 0 ok, 2 invalid input or unjustified cost, 3 project not analyzed or file not written.
crud.project=Root directory of the project (where pom.xml or build.gradle is).
crud.entity=Name of the entity, such as User or OrderItem.
crud.fields=Fields as name:Type, such as name:String price:BigDecimal. Types: String, Integer, Long, Double, Boolean, BigDecimal, LocalDate, LocalDateTime, Instant, UUID.
crud.architecture=Architecture to follow: hexagonal, layered or package-by-feature. Default: the one the Shishō detects in the project.
crud.package=Base package. Default: the package every class shares, which in a Spring Initializr project is the Application class's.
crud.route=REST route, without slashes. Default: the entity's name in the plural (OrderItem becomes order-items).
crud.anyway=Generate even if nothing in the shisho.yaml context pays for the architecture's cost, such as hexagonal for a CRUD without rules.
