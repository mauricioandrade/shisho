kata.field-injection.lesson={0} is injected straight into the field. So new creates the class without the dependency, the error only shows up as a NullPointerException in use, and a test needs Spring or reflection. Receive it through the constructor, in a private final field.
kata.lombok-constructor.lesson=@{0} generates the constructor that declares what the class depends on, and it disappears from the code: readers cannot see the dependencies, and the tenth one slips in unnoticed. Write the constructor.
kata.non-final-dependency.lesson=Dependency {0} is not final: any method can replace it after construction, and the compiler does not guarantee it was assigned. Make it private final.
kata.system-out.lesson={0} writes straight to the console: no level, no timestamp, no source class, and outside what a log aggregator collects and filters. Use a logger (SLF4J or System.Logger).
kata.system-out.lesson.quarkus={0} writes straight to the console: no level, no timestamp, no source class, and outside what a log aggregator collects and filters. Use the Quarkus logger: Log.info(...), from io.quarkus.logging.Log, with nothing to declare.
kata.value-outside-constructor.lesson=@Value on {0}, outside the constructor: the value arrives by reflection after the object exists, and a test using new leaves it empty. Receive the setting as a constructor parameter, or group it in @ConfigurationProperties.
kata.request-body-without-valid.lesson=@RequestBody {0} without @Valid: the DTO validation annotations are ignored, and invalid data reaches the service as if it were valid. Add @Valid before @RequestBody.
kata.request-body-without-valid.lesson.quarkus=Body {0} without @Valid: the DTO validation annotations are ignored, and invalid data reaches the service as if it were valid. Add @Valid before the body parameter.
kata.dto-not-record.lesson={0} looks like a DTO but is not a record. As a record it becomes immutable and drops the hand-written constructor, getters, equals, hashCode and toString.
kata.entity-in-controller.lesson=Endpoint {1}() exposes the JPA entity {0} in the API. Use request/response records: the database schema stops being the API contract, internal fields do not leak and clients cannot overwrite them.
kata.transactional-read-only.lesson={0}() only reads data but runs in a read-write transaction. Use @Transactional(readOnly = true): Hibernate skips dirty checking and the database can optimize the read.
kata.missing-controller-advice.lesson=The project has controllers, such as {0}, but no @RestControllerAdvice: each endpoint handles (or forgets to handle) its own errors. Centralize error handling in a @RestControllerAdvice and answer with ProblemDetail (RFC 9457).
kata.missing-controller-advice.lesson.spring-boot-2=The project has controllers, such as {0}, but no @RestControllerAdvice: each endpoint handles (or forgets to handle) its own errors. Centralize the handling in a @RestControllerAdvice that always answers in the same format, such as application/problem+json (RFC 9457). In Spring Boot 3, the ProblemDetail class already builds that format.
kata.missing-controller-advice.lesson.quarkus=The project has resources, such as {0}, but no ExceptionMapper: each endpoint handles (or forgets to handle) its own errors. Centralize error handling in @ServerExceptionMapper methods and answer in a single format, such as application/problem+json (RFC 9457).
kata.missing-actuator.lesson=Web application without spring-boot-starter-actuator. Without /actuator/health, whatever runs the application (Kubernetes, ECS, a load balancer) cannot tell whether it is alive, and there are no metrics. Add the starter and expose only the endpoints you need.
kata.missing-actuator.lesson.quarkus=Web application without quarkus-smallrye-health. Without /q/health, whatever runs the application (Kubernetes, ECS, a load balancer) cannot tell whether it is alive. Add the extension; for metrics, quarkus-micrometer.
kata.missing-springdoc.lesson=Web application without OpenAPI documentation. With springdoc-openapi, the API contract is generated from the code and Swagger UI is available to whoever consumes the API.
kata.missing-springdoc.lesson.quarkus=Web application without OpenAPI documentation. With the quarkus-smallrye-openapi extension, the API contract is generated from the code and Swagger UI is available at /q/swagger-ui to whoever consumes the API.
kata.avoided-dependency.lesson={0} ({1}): {2}. Alternative: {3}.
kata.configuration-properties-not-record.lesson={0} is a @ConfigurationProperties bound through setters. As a record, the configuration is bound through the constructor, becomes immutable and nobody changes it after startup.
kata.prefer-configuration-properties.lesson={1} {0}.* properties injected one by one with @Value. Group them in a record with @ConfigurationProperties("{0}"): typed, validatable and declared in a single place.
kata.prefer-configuration-properties.lesson.quarkus={1} {0}.* properties injected one by one with @ConfigProperty. Group them in an interface with @ConfigMapping(prefix = "{0}"): typed, validatable and declared in a single place.
kata.prefer-virtual-threads.lesson=Executors.{0} creates platform threads, which are expensive and limited. For tasks that wait on I/O (HTTP, database, files), Executors.newVirtualThreadPerTaskExecutor() gives each task a cheap virtual thread, with no pool to size. For CPU-bound work, the fixed pool is still right.
kata.prefer-scoped-values.lesson=Field {0} is a ThreadLocal. For context that follows an execution (user, request), ScopedValue is immutable, only valid inside the block that binds it and needs no remove(): nothing leaks between tasks, even with virtual threads.
kata.quarkus-private-injection.lesson=The injected field {0} is private: ArC cannot fill it with the code it generates at build time and falls back to reflection, which costs at startup and must be registered in the native image. Drop private and leave the field package-private, as the Quarkus documentation recommends.
kata.unproxyable-method.lesson=@{0} on {1}(), which is {2}: Spring's proxy cannot reach the method, and the annotation is silently ignored. The code runs without a transaction, a cache or async execution, and nothing warns you. Make the method public (and neither final nor static), or move it to another bean.
kata.unproxyable-method.lesson.spring-boot-2=@{0} on {1}(), which is {2}: in Spring Boot 2 the proxy only intercepts public methods, and the annotation is silently ignored. The code runs without a transaction, a cache or async execution, and nothing warns you. Make the method public; Spring 6 (Boot 3) also accepts protected and package-private.
kata.swallowed-exception.lesson=Empty catch ({0}): the exception disappears without a trace, and the error shows up later, far from its cause, or never. Log it, rethrow it (wrapped in an exception that says what failed) or, if ignoring it is on purpose, say so in the code: a comment with the reason, or the variable named ignored (or _, from Java 22).
kata.entity-with-lombok-data.lesson={0} is a JPA entity with @{1}: equals and hashCode use every field, the generated id and lazy collections included. The hashCode changes when persist fills in the id (the entity gets lost inside a HashSet), and @Data's toString can trigger a LazyInitializationException or a loop between entities that reference each other. Use @Getter and @Setter, and write equals and hashCode by the id.
kata.unproxyable-method.lesson.self-invocation=The call to {1}(), annotated with @{0}, comes from inside the class itself: it goes straight to the object, without going through Spring's proxy, and the annotation is ignored on that call. The code runs without the transaction, the cache or the async execution the annotation promises. Move {1}() to another bean and call it there, or annotate the calling method.
kata.entity-without-default-constructor.lesson={0} is mapped by JPA, but every one of its constructors takes parameters. Hibernate creates the entity with no arguments when it reads it from the database and fills in the fields afterwards, so the first query fails with an InstantiationException. Add a protected no-argument constructor: JPA accepts it, and the rest of the code keeps using the constructor with parameters.
kata.eager-collection.lesson={0} is a @{1} with fetch = EAGER: every query that brings the entity brings the whole collection too, even when nobody will use it. On a list, that becomes one query per row (N+1) or a Cartesian product. Leave it LAZY, the default, and fetch the collection only where it is used, with JOIN FETCH or @EntityGraph.
kata.to-one-without-lazy.lesson={0} is a @{1} without fetch: JPA's default for this relationship is EAGER, so every entity loaded brings the other one along, and a list of them fires one query per row (N+1). Use fetch = FetchType.LAZY and fetch the relationship with JOIN FETCH where it is used.
kata.transactional-controller.lesson={0} is a controller with @Transactional: the transaction wraps the handling of the whole request, and the business logic it should protect lives in the wrong place. Move the transaction, and the logic it covers, to a @Service; the controller only translates HTTP into the service call.
kata.destructive-schema-generation.lesson={0}={1} applies outside the development profiles: on every start, Hibernate drops the tables and creates them again, and the data goes with them. In production, use validate (or none) and version the schema with Flyway or Liquibase; keep {1} in an application-dev or application-test.
kata.destructive-schema-generation.lesson.quarkus={0}={1} without a profile prefix applies to production too: on every start, Hibernate drops the tables and creates them again, and the data goes with them. Use %dev.{0} (or %test.), and none or validate in production, with the schema versioned by Flyway or Liquibase.
architecture.dependency-rule.lesson={0} is in {1} and imports {2}. In {4}, {1} must not depend on {3}: that direction of dependencies is what keeps the core independent of the details.
detector.um_use_case_por_metodo_crud={1} use cases just for CRUD operations on {0}: one use case per method, with no business rule to justify each one.
detector.dominio_anemico={0} of the {1} domain classes only have getters and setters: the business rules live outside the domain.
detector.entidade_de_dominio_identica_a_entidade_jpa={0} and the JPA entity {1} have exactly the same fields: two copies of one structure, plus the mapping between them.
detector.mappers_entre_estruturas_identicas=A mapper converts {0} into {1}, which have exactly the same fields.
detector.pacote_service_com_mais_de_15_classes=Package {0} has {1} classes.
detector.service_deus={0} has {1} methods and {2} constructor dependencies.
detector.dependencias_ciclicas_entre_services={0} and {1} depend on each other.
