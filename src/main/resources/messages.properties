shisho.ask.usage.description=Asks a local LLM (Ollama) to explain the analysis: the verdict, the rank and the lessons. The model only explains; everything it reads was computed by the Shishō. Exit code: 0 ok, 2 invalid input, 3 project not analyzed or model unavailable.
