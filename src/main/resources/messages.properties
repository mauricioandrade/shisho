kata.field-injection.lesson=Field injection in {0}. Use an explicit constructor with private final fields: the dependency becomes visible and the object, immutable.
kata.lombok-constructor.lesson=@{0} hides the constructor that declares what this class depends on. Write it explicitly: it documents the class needs.
kata.non-final-dependency.lesson=Dependency {0} is not final. Make it private final so it cannot be replaced after construction.
kata.system-out.lesson={0} writes straight to the console, with no level or format. Use a logger (SLF4J or System.Logger).
kata.value-outside-constructor.lesson=@Value on {0}, outside the constructor. Receive the setting as a constructor parameter (or group it in @ConfigurationProperties): explicit and testable without Spring.
kata.request-body-without-valid.lesson=@RequestBody {0} without @Valid: the DTO validation annotations are never checked.
kata.dto-not-record.lesson={0} looks like a DTO but is not a record. A record is immutable and removes hand-written getters, equals and hashCode.
