kata.field-injection.lesson=Field injection in {0}. Use an explicit constructor with private final fields: the dependency becomes visible and the object, immutable.
kata.lombok-constructor.lesson=@{0} hides the constructor that declares what this class depends on. Write it explicitly: it documents the class needs.
kata.non-final-dependency.lesson=Dependency {0} is not final. Make it private final so it cannot be replaced after construction.
kata.system-out.lesson={0} writes straight to the console, with no level or format. Use a logger (SLF4J or System.Logger).
kata.value-outside-constructor.lesson=@Value on {0}, outside the constructor. Receive the setting as a constructor parameter (or group it in @ConfigurationProperties): explicit and testable without Spring.
kata.request-body-without-valid.lesson=@RequestBody {0} without @Valid: the DTO validation annotations are never checked.
kata.dto-not-record.lesson={0} looks like a DTO but is not a record. A record is immutable and removes hand-written getters, equals and hashCode.
kata.entity-in-controller.lesson=Endpoint {1}() exposes the JPA entity {0} in the API. Use request/response records: the database schema stops being the API contract, internal fields do not leak and clients cannot overwrite them.
kata.transactional-read-only.lesson={0}() only reads data but runs in a read-write transaction. Use @Transactional(readOnly = true): Hibernate skips dirty checking and the database can optimize the read.
kata.missing-controller-advice.lesson=The project has controllers, such as {0}, but no @RestControllerAdvice: each endpoint handles (or forgets to handle) its own errors. Centralize error handling in a @RestControllerAdvice and answer with ProblemDetail (RFC 9457).
kata.missing-actuator.lesson=Web application without spring-boot-starter-actuator. Without /actuator/health, whatever runs the application (Kubernetes, ECS, a load balancer) cannot tell whether it is alive, and there are no metrics. Add the starter and expose only the endpoints you need.
kata.missing-springdoc.lesson=Web application without OpenAPI documentation. With springdoc-openapi, the API contract is generated from the code and Swagger UI is available to whoever consumes the API.
kata.avoided-dependency.lesson={0} ({1}): {2}. Alternative: {3}.
kata.configuration-properties-not-record.lesson={0} is a @ConfigurationProperties bound through setters. As a record, the configuration is bound through the constructor, becomes immutable and nobody changes it after startup.
kata.prefer-configuration-properties.lesson={1} {0}.* properties injected one by one with @Value. Group them in a record with @ConfigurationProperties("{0}"): typed, validatable and declared in a single place.
kata.prefer-virtual-threads.lesson=Executors.{0} creates platform threads, which are expensive and limited. For tasks that wait on I/O (HTTP, database, files), Executors.newVirtualThreadPerTaskExecutor() gives each task a cheap virtual thread, with no pool to size. For CPU-bound work, the fixed pool is still right.
kata.prefer-scoped-values.lesson=Field {0} is a ThreadLocal. For context that follows an execution (user, request), ScopedValue is immutable, only valid inside the block that binds it and needs no remove(): nothing leaks between tasks, even with virtual threads.
architecture.dependency-rule.lesson={0} is in {1} and imports {2}. In {4}, {1} must not depend on {3}: that direction of dependencies is what keeps the core independent of the details.
detector.um_use_case_por_metodo_crud={1} use cases just for CRUD operations on {0}: one use case per method, with no business rule to justify each one.
detector.dominio_anemico={0} of the {1} domain classes only have getters and setters: the business rules live outside the domain.
detector.entidade_de_dominio_identica_a_entidade_jpa={0} and the JPA entity {1} have exactly the same fields: two copies of one structure, plus the mapping between them.
detector.mappers_entre_estruturas_identicas=A mapper converts {0} into {1}, which have exactly the same fields.
detector.pacote_service_com_mais_de_15_classes=Package {0} has {1} classes.
detector.service_deus={0} has {1} methods and {2} constructor dependencies.
detector.dependencias_ciclicas_entre_services={0} and {1} depend on each other.
