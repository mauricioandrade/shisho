kata.field-injection.lesson={0} é injetado direto no campo. Assim, new cria a classe sem a dependência, o erro só aparece como NullPointerException em uso e o teste precisa de Spring ou reflexão. Receba a dependência pelo construtor, num campo private final.
kata.lombok-constructor.lesson=@{0} gera o construtor que declara do que a classe depende, e ele some do código: quem lê não vê as dependências, e a décima dependência entra sem ninguém notar. Escreva o construtor.
kata.non-final-dependency.lesson=A dependência {0} não é final: qualquer método pode trocá-la depois da construção, e o compilador não garante que ela foi atribuída. Marque-a como private final.
kata.system-out.lesson={0} escreve direto no console: sem nível, sem horário, sem a classe de origem, e fora do que um agregador de logs coleta e filtra. Use um logger (SLF4J ou System.Logger).
kata.system-out.lesson.quarkus={0} escreve direto no console: sem nível, sem horário, sem a classe de origem, e fora do que um agregador de logs coleta e filtra. Use o logger do Quarkus: Log.info(...), de io.quarkus.logging.Log, sem declarar nada.
kata.value-outside-constructor.lesson=@Value em {0}, fora do construtor: o valor chega por reflexão depois que o objeto existe, e um teste com new fica com ele vazio. Receba a configuração como parâmetro do construtor, ou agrupe-a em @ConfigurationProperties.
kata.request-body-without-valid.lesson=@RequestBody {0} sem @Valid: as anotações de validação do DTO são ignoradas, e dados inválidos chegam ao service como se fossem válidos. Adicione @Valid antes do @RequestBody.
kata.request-body-without-valid.lesson.quarkus=Corpo {0} sem @Valid: as anotações de validação do DTO são ignoradas, e dados inválidos chegam ao service como se fossem válidos. Adicione @Valid antes do parâmetro do corpo.
kata.dto-not-record.lesson={0} parece um DTO, mas não é record. Como record, fica imutável e dispensa construtor, getters, equals, hashCode e toString escritos à mão.
kata.entity-in-controller.lesson=O endpoint {1}() expõe a entidade JPA {0} na API. Use records de request/response: o esquema do banco deixa de ser o contrato da API, campos internos não vazam e o cliente não consegue sobrescrevê-los.
kata.transactional-read-only.lesson={0}() só lê dados, mas roda numa transação de escrita. Use @Transactional(readOnly = true): o Hibernate dispensa o dirty checking e o banco pode otimizar a leitura.
kata.missing-controller-advice.lesson=O projeto tem controllers, como {0}, mas nenhum @RestControllerAdvice: cada endpoint trata (ou esquece de tratar) os próprios erros. Centralize o tratamento num @RestControllerAdvice e responda com ProblemDetail (RFC 9457).
kata.missing-controller-advice.lesson.spring-boot-2=O projeto tem controllers, como {0}, mas nenhum @RestControllerAdvice: cada endpoint trata (ou esquece de tratar) os próprios erros. Centralize o tratamento num @RestControllerAdvice que responda sempre no mesmo formato, como o application/problem+json (RFC 9457). No Spring Boot 3, a classe ProblemDetail já monta esse formato.
kata.missing-controller-advice.lesson.quarkus=O projeto tem resources, como {0}, mas nenhum ExceptionMapper: cada endpoint trata (ou esquece de tratar) os próprios erros. Centralize o tratamento em métodos @ServerExceptionMapper e responda num formato só, como application/problem+json (RFC 9457).
kata.missing-actuator.lesson=Aplicação web sem spring-boot-starter-actuator. Sem /actuator/health, quem orquestra a aplicação (Kubernetes, ECS, um load balancer) não sabe se ela está viva, e não há métricas. Adicione o starter e exponha só os endpoints necessários.
kata.missing-actuator.lesson.quarkus=Aplicação web sem quarkus-smallrye-health. Sem /q/health, quem orquestra a aplicação (Kubernetes, ECS, um load balancer) não sabe se ela está viva. Adicione a extensão; para métricas, a quarkus-micrometer.
kata.missing-springdoc.lesson=Aplicação web sem documentação OpenAPI. Com o springdoc-openapi, o contrato da API é gerado a partir do código e o Swagger UI fica disponível para quem consome a API.
kata.missing-springdoc.lesson.quarkus=Aplicação web sem documentação OpenAPI. Com a extensão quarkus-smallrye-openapi, o contrato da API é gerado a partir do código e o Swagger UI fica em /q/swagger-ui para quem consome a API.
kata.avoided-dependency.lesson={0} ({1}): {2}. Alternativa: {3}.
kata.configuration-properties-not-record.lesson={0} é um @ConfigurationProperties ligado por setters. Como record, a configuração é ligada pelo construtor, fica imutável e ninguém a altera depois da inicialização.
kata.prefer-configuration-properties.lesson={1} propriedades {0}.* injetadas uma a uma com @Value. Agrupe-as num record com @ConfigurationProperties("{0}"): tipadas, validáveis e declaradas num lugar só.
kata.prefer-configuration-properties.lesson.quarkus={1} propriedades {0}.* injetadas uma a uma com @ConfigProperty. Agrupe-as numa interface com @ConfigMapping(prefix = "{0}"): tipadas, validáveis e declaradas num lugar só.
kata.prefer-virtual-threads.lesson=Executors.{0} cria threads de plataforma, caras e limitadas. Para tarefas que esperam I/O (HTTP, banco, arquivos), Executors.newVirtualThreadPerTaskExecutor() dá uma virtual thread barata a cada tarefa, sem dimensionar pool. Para trabalho de CPU, o pool fixo continua certo.
kata.prefer-scoped-values.lesson=O campo {0} é um ThreadLocal. Para contexto que acompanha uma execução (usuário, requisição), ScopedValue é imutável, vale só dentro do bloco que o define e não precisa de remove(): nada vaza entre tarefas, nem com virtual threads.
kata.quarkus-private-injection.lesson=O campo injetado {0} é private: o ArC não consegue preenchê-lo com o código que gera na compilação e volta à reflexão, que custa na inicialização e precisa ser registrada na imagem nativa. Tire o private e deixe o campo package-private, como a documentação do Quarkus recomenda.
kata.unproxyable-method.lesson=@{0} em {1}(), que é {2}: o proxy do Spring não alcança o método, e a anotação é ignorada em silêncio. O código roda sem transação, sem cache ou sem execução assíncrona, e nada avisa. Torne o método public (e não final nem static), ou mova-o para outro bean.
kata.unproxyable-method.lesson.spring-boot-2=@{0} em {1}(), que é {2}: no Spring Boot 2, o proxy só intercepta métodos public, e a anotação é ignorada em silêncio. O código roda sem transação, sem cache ou sem execução assíncrona, e nada avisa. Torne o método public; o Spring 6 (Boot 3) passou a aceitar também protected e package-private.
kata.swallowed-exception.lesson=catch ({0}) vazio: a exceção some sem deixar rastro, e o erro aparece depois, longe da causa, ou nunca. Registre num logger, relance (envolvida numa exceção que diga o que falhou) ou, se ignorar é de propósito, diga isso no código: um comentário com o porquê, ou a variável chamada ignored (ou _, a partir do Java 22).
kata.entity-with-lombok-data.lesson={0} é uma entidade JPA com @{1}: equals e hashCode usam todos os campos, inclusive o id gerado e as coleções lazy. O hashCode muda quando o persist preenche o id (a entidade se perde dentro de um HashSet), e o toString do @Data pode disparar LazyInitializationException ou um laço entre entidades que se referenciam. Use @Getter e @Setter, e escreva equals e hashCode pelo id.
architecture.dependency-rule.lesson={0} está em {1} e importa {2}. Na {4}, {1} não pode depender de {3}: é essa direção das dependências que mantém o núcleo independente dos detalhes.
detector.um_use_case_por_metodo_crud={1} use cases só para operações CRUD de {0}: um use case por método, sem regra de negócio que justifique cada um.
detector.dominio_anemico={0} das {1} classes do domínio só têm getters e setters: as regras de negócio vivem fora dele.
detector.entidade_de_dominio_identica_a_entidade_jpa={0} e a entidade JPA {1} têm exatamente os mesmos campos: duas cópias da mesma estrutura, mais o mapeamento entre elas.
detector.mappers_entre_estruturas_identicas=Um mapper converte {0} em {1}, que têm exatamente os mesmos campos.
detector.pacote_service_com_mais_de_15_classes=O pacote {0} tem {1} classes.
detector.service_deus={0} tem {1} métodos e {2} dependências no construtor.
detector.dependencias_ciclicas_entre_services={0} e {1} dependem um do outro.
