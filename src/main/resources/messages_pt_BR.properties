kata.field-injection.lesson=Injeção em campo em {0}. Use construtor explícito com private final: a dependência fica visível e o objeto, imutável.
kata.lombok-constructor.lesson=@{0} esconde o construtor que declara do que esta classe depende. Escreva-o explicitamente: ele documenta o que a classe precisa.
kata.non-final-dependency.lesson=A dependência {0} não é final. Marque-a como private final para que não possa ser trocada depois da construção.
kata.system-out.lesson={0} escreve direto no console, sem nível nem formato. Use um logger (SLF4J ou System.Logger).
kata.value-outside-constructor.lesson=@Value em {0}, fora do construtor. Receba a configuração como parâmetro do construtor (ou agrupe em @ConfigurationProperties): fica explícito e testável sem Spring.
kata.request-body-without-valid.lesson=@RequestBody {0} sem @Valid: as anotações de validação do DTO nunca são verificadas.
kata.dto-not-record.lesson={0} parece um DTO, mas não é record. Um record é imutável e elimina getters, equals e hashCode escritos à mão.
kata.entity-in-controller.lesson=O endpoint {1}() expõe a entidade JPA {0} na API. Use records de request/response: o esquema do banco deixa de ser o contrato da API, campos internos não vazam e o cliente não consegue sobrescrevê-los.
kata.transactional-read-only.lesson={0}() só lê dados, mas roda numa transação de escrita. Use @Transactional(readOnly = true): o Hibernate dispensa o dirty checking e o banco pode otimizar a leitura.
kata.missing-controller-advice.lesson=O projeto tem controllers, como {0}, mas nenhum @RestControllerAdvice: cada endpoint trata (ou esquece de tratar) os próprios erros. Centralize o tratamento num @RestControllerAdvice e responda com ProblemDetail (RFC 9457).
kata.missing-actuator.lesson=Aplicação web sem spring-boot-starter-actuator. Sem /actuator/health, quem orquestra a aplicação (Kubernetes, ECS, um load balancer) não sabe se ela está viva, e não há métricas. Adicione o starter e exponha só os endpoints necessários.
kata.missing-springdoc.lesson=Aplicação web sem documentação OpenAPI. Com o springdoc-openapi, o contrato da API é gerado a partir do código e o Swagger UI fica disponível para quem consome a API.
