usage.description=O mestre que lê seu código Java/Spring Boot, aponta o que está errado e explica por quê.
shisho.analyze.usage.description=Aplica as katas a um projeto e dá a graduação. Código de saída: 0 sem lições graves, 1 com lições graves, 2 entrada inválida, 3 projeto não pôde ser analisado.
analyze.project=Diretório raiz do projeto (onde está o pom.xml ou o build.gradle).
analyze.format=Formato do relatório: terminal, sarif (para o code scanning do GitHub) ou html (uma página para o navegador). Padrão: terminal.
analyze.output=Grava o relatório neste arquivo em vez de mostrá-lo na tela.
analyze.sensei=Modo sensei: mostra, para cada kata encontrada, por que ela existe, quando o código acusado é aceitável, o código antes e depois da correção e as fontes.
analyze.shoshin=Modo shoshin (初心, mente de principiante): explica os conceitos que aparecem no código, como record, injeção de dependência e o padrão Strategy, e onde cada um está. Só no relatório do terminal.
shisho.fix.usage.description=Corrige no código as lições que têm uma correção mecânica segura. Mostra o diff; com --apply, grava os arquivos. Código de saída: 0 ok, 2 entrada inválida, 3 projeto não analisado ou arquivo não gravado.
fix.project=Diretório raiz do projeto (onde está o pom.xml ou o build.gradle).
fix.apply=Grava as correções nos arquivos. Sem esta opção, só mostra o diff.
fix.summary.preview=Correções possíveis: {0} em {1}. Rode de novo com --apply para gravá-las.
fix.summary.applied=Corrigido: {0} em {1}.
fix.summary.nothing=Nenhuma lição tem correção automática segura.
fix.summary.clean=Nenhuma lição: nada a corrigir.
fix.summary.unfixed={0} sem correção automática. Veja como corrigir com: shisho analyze --sensei
fix.count.lessons={0,choice,1#1 lição|1<{0,number,integer} lições}
fix.count.files={0,choice,1#1 arquivo|1<{0,number,integer} arquivos}
fix.error.changed={0} mudou desde a análise e não foi gravado.
fix.error.write=Não foi possível gravar {0}.
shisho.ask.usage.description=Pede a um LLM local (Ollama) que explique a análise: o veredito, a graduação e as lições. O modelo só explica; tudo o que ele lê foi calculado pelo Shishō. Código de saída: 0 ok, 2 entrada inválida, 3 projeto não analisado ou modelo indisponível.
ask.project=Diretório raiz do projeto (onde está o pom.xml ou o build.gradle).
ask.question=Pergunta sobre a análise. Sem ela, o modelo explica o veredito e a graduação.
ask.model=Modelo do Ollama. Padrão: ${DEFAULT-VALUE}.
ask.url=Endereço do Ollama. Padrão: ${DEFAULT-VALUE}.
ask.waiting=Perguntando ao {0} em {1}...
ask.footer=Explicação escrita por {0}, que pode errar. O veredito, a graduação e as lições vêm da análise determinística: shisho analyze.
shisho.crud.usage.description=Cria um CRUD REST na arquitetura do projeto (ou na de --arquitetura) e explica cada arquivo: entidade, repositório, DTOs, service, controller e tratamento de erros. Nunca sobrescreve um arquivo, e só gera uma arquitetura de custo médio ou alto se o contexto do shisho.yaml a justificar (ou com --mesmo-assim). Código de saída: 0 ok, 2 entrada inválida ou custo sem justificativa, 3 projeto não analisado ou arquivo não gravado.
crud.project=Diretório raiz do projeto (onde está o pom.xml ou o build.gradle).
crud.entity=Nome da entidade, como Usuario ou ItemPedido.
crud.fields=Campos no formato nome:Tipo, como nome:String preco:BigDecimal. Tipos: String, Integer, Long, Double, Boolean, BigDecimal, LocalDate, LocalDateTime, Instant, UUID.
crud.architecture=Arquitetura a seguir: hexagonal, layered ou package-by-feature. Padrão: a que o Shishō detectar no projeto.
crud.package=Pacote base. Padrão: o pacote comum a todas as classes, que num projeto do Spring Initializr é o da classe Application.
crud.route=Rota REST, sem barras. Padrão: o nome da entidade no plural (ItemPedido vira item-pedidos).
crud.anyway=Gera mesmo que nada no contexto do shisho.yaml pague o custo da arquitetura, como a hexagonal num CRUD sem regras.
crud.header=師匠 Shishō — CRUD de {0} em {1}
crud.skipped=Não foi criado: o projeto já tem uma classe que faz o papel deste arquivo.
crud.warning.mixed=⚠ O projeto segue {0}, e este CRUD segue {1}. Dois estilos no mesmo projeto obrigam quem lê a aprender os dois. Se a intenção é migrar, leve as features antigas junto.
crud.warning.dependencies=⚠ O código gerado precisa destas dependências, que faltam no build: {0}.
crud.warning.cost=⚠ Este CRUD em {0} cria {1}, e nada no contexto do shisho.yaml paga esse custo. A arquitetura vale a pena quando o projeto tem: {2}.
crud.warning.cost.simpler=Para um CRUD sem regras de negócio, {0} faz o mesmo com menos arquivos.
crud.cost.paid=✓ {0} se paga neste projeto, segundo o contexto do shisho.yaml: {1}. O CRUD gerado ainda não tem regra de negócio: até o domínio ganhar as suas, o shisho analyze vai apontar o custo da arquitetura.
crud.summary={0,choice,1#Criado|1<Criados} {1}. Rode shisho analyze para conferir: o código gerado passa em todas as katas.
crud.error.exists={0} já existe.
crud.error.java-version=O projeto usa Java {0}, e o CRUD gerado usa records e o Spring Boot 3 (ou o Quarkus 3), que pedem Java {1}. Nada foi gravado: migre o projeto para o Java {1} antes.
crud.error.refused-import={0} importa {1}, e o CRUD gerado não compila junto: os templates são do Spring Boot 3 e do Quarkus 3, que usam jakarta.*. Nada foi gravado: migre o projeto para o namespace jakarta antes.
crud.error.platform-version=O build fixa {0} na versão {1}, e o CRUD gerado pede a {2} ou mais nova. Nada foi gravado: migre o projeto antes.
crud.error.nothing-written=Nada foi gravado: o Shishō nunca sobrescreve um arquivo.
crud.error.cost=Nada foi gravado. Se o projeto tem um desses motivos, declare-o em contexto.caracteristicas no shisho.yaml: a decisão fica registrada, e o shisho analyze passa a usá-la. Para gerar mesmo assim, use --mesmo-assim.
cli.error.cannot-write=Não foi possível gravar o relatório em {0}.
llm.error.unreachable=Não foi possível falar com o Ollama em {0}. Ele está rodando? Inicie com: ollama serve
llm.error.model-not-found=O modelo {0} não está instalado no Ollama. Instale com: ollama pull {0}
llm.error.server=O Ollama respondeu com um erro: {0}
llm.error.response=O Ollama mandou uma resposta que o Shishō não entendeu.
crud.error.package={0} não é um nome de pacote Java válido.
crud.error.entity-name={0} não é um nome de entidade válido: use um nome de classe Java, como Usuario ou ItemPedido.
crud.error.no-fields=Informe ao menos um campo no formato nome:Tipo, como: shisho crud . Usuario nome:String email:String
crud.error.field="{0}" não é um campo: use nome:Tipo, como nome:String ou preco:BigDecimal.
crud.error.field-name={0} não é um nome de campo válido: use um identificador Java em camelCase, diferente de id (o CRUD já cria o id).
crud.error.duplicate-field=O campo {0} aparece mais de uma vez.
crud.error.type=O tipo {0} não é suportado. Tipos aceitos: {1}.
crud.error.route={0} não é uma rota válida: use letras minúsculas, números e hífens, como itens-pedido.
crud.error.no-architecture=O Shishō não reconheceu a arquitetura do projeto. Escolha uma com --arquitetura: {0}.
crud.error.unknown-architecture=Não há template de CRUD para {0}. Disponíveis: {1}.
crud.error.no-scaffold=O projeto segue {0}, que ainda não tem template de CRUD. Escolha um com --arquitetura: {1}.
crud.error.no-package=O projeto não tem nenhuma classe que indique o pacote base. Informe-o com --pacote, como --pacote com.exemplo.loja.
hook.header=師匠 Shishō: {0,choice,1#1 lição|1<{0,number,integer} lições} em {1}, que você acabou de editar:
hook.footer=Corrija o que fizer sentido. Se uma lição não se aplica a este código, diga isso a quem pediu, com o motivo, em vez de reescrever o código só para calar a kata. O porquê de cada kata: shisho analyze --sensei {0}
ask.prompt.instructions=Você é o Shishō (師匠), um sensei de Java e Spring Boot. Um analisador determinístico já \
examinou o projeto, e a análise abaixo é o resultado dele: está correta. Seu papel é explicá-la a quem escreveu o \
código, como um mestre explica a um aluno, com clareza, com exemplos do próprio projeto e sem sermão.\n\n\
Regras:\n\
- Use somente os fatos da análise e o texto das arquiteturas do catálogo. Não invente lições, arquivos, classes, \
números nem arquiteturas.\n\
- Não mude o veredito, a graduação nem a severidade das lições. Explique por que eles são assim.\n\
- Uma lição aponta um custo, não um pecado. Diga quando esse custo importa.\n\
- Se a pergunta for sobre algo que a análise não mostra, diga isso em vez de supor.\n\
- Fale direto com quem escreveu o código, na segunda pessoa (você).\n\
- Responda em português do Brasil, em no máximo 4 parágrafos curtos ou uma lista curta.
